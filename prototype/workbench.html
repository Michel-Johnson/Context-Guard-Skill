<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context Guard · 工作台原型</title>
<style>
:root{
  --ink:#2a2f2b; --muted:#75807a; --paper:#ffffff; --bg:#fafaf7; --line:#d9ded7;
  --green:#2f7d63; --green-soft:#e2efe7; --red:#b34a3f; --red-soft:#f6e5e2;
  --blue:#3d6ea5; --blue-soft:#e3ecf5; --gray:#9aa59c;
  --focus:#8a6d1f; --focus-soft:#f5eeda; --module:#5c6f8a; --module-soft:#eef2f7;
  --auth:#7a5ca8; --auth-soft:#f0eaf8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
body.auth-mode{background:#f6f3fa}

header.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:13px;
  padding:10px 18px;background:rgba(250,250,247,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(4px);flex-wrap:wrap;cursor:default}
header.top .eyebrow{color:var(--green);font-weight:750;font-size:11px;letter-spacing:.08em}
header.top h1{margin:0;font-size:16px}
.nav-crumbs{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
.nav-crumbs a{color:var(--module);cursor:pointer;text-decoration:none;padding:3px 9px;
  border:1px solid transparent;border-radius:6px}
.nav-crumbs a:hover{border-color:var(--line);background:#fff}
.nav-crumbs .here{font-weight:700;padding:3px 9px;background:var(--module-soft);border-radius:6px;color:var(--module)}
.nav-crumbs .sep{color:var(--line)}
.session-chip{display:flex;align-items:center;gap:7px;background:var(--auth-soft);border:1px solid #d8cceb;
  border-radius:8px;padding:4px 11px;font-size:12.5px;color:var(--auth);margin-left:auto}
.session-chip b{font-weight:700}
.tray-btn,.auth-btn{font-size:12.5px;padding:5px 11px}
.auth-btn.on{background:var(--auth);border-color:var(--auth);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.dirty{background:var(--blue)} .dot.success{background:var(--green)}
.dot.failed{background:var(--red)} .dot.module{background:var(--module);border-radius:2px}
.dot.proposed{background:#c7ccc6} .dot.noauth{background:#cfcfcf}

/* ---------- 画布 ---------- */
#viewport{position:absolute;inset:52px 0 0 0;cursor:default}
#viewport.grabbing{cursor:move}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path.link{fill:none;stroke:#c3cdc0;stroke-width:1.5;transition:opacity .2s}
#links path.link.dimmed{opacity:.12}
#links path.link.focus-link{stroke:var(--green);stroke-width:2}
#links path.link.proposed-link{stroke-dasharray:5 4;stroke:#c7ccc6}
#links path.link.noauth-link{stroke:#d7d7d4}

/* ===== 节点：小圆角胶囊 ===== */
.node{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:var(--paper);border:1px solid var(--line);border-radius:17px;
  padding:5px 13px 5px 11px;font-size:12.5px;line-height:1.45;cursor:pointer;user-select:none;
  box-shadow:0 1px 2px rgba(42,47,43,.05);transition:opacity .2s, box-shadow .12s, border-color .12s}
.node:hover{box-shadow:0 2px 8px rgba(42,47,43,.13);border-color:#b9c4b6}
.node.selected{border-color:var(--green);box-shadow:0 0 0 2.5px var(--green-soft)}
.node.dimmed{opacity:.18}

/* 项目根：大号圆角 */
.node.root{font-size:16px;font-weight:750;padding:16px 24px;border-width:1.5px;
  border-color:#aab8a8;border-radius:14px}

/* ===== 模块：大块方形卡片 ===== */
.node.module{display:block;white-space:normal;width:248px;
  border:1.5px solid #b7c2d2;background:var(--module-soft);border-radius:4px;
  padding:15px 17px 14px;box-shadow:0 2px 6px rgba(92,111,138,.12)}
.node.module:hover{border-color:var(--module);box-shadow:0 5px 16px rgba(92,111,138,.26)}
.node.module .m-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.node.module .m-head .dot{width:11px;height:11px}
.node.module .m-blurb{margin-top:8px;color:var(--muted);font-size:12.5px;font-weight:400;line-height:1.55}
.node.module.selected{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* Agent 提议节点（圆角虚线胶囊） */
.node.proposed{border:1.5px dashed #bcc4bb;background:#f3f4f0;color:var(--muted)}
.node.proposed:hover{border-color:var(--green);color:var(--ink)}
.node .new-dot{position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;
  background:var(--green);border:2px solid #fff;box-shadow:0 0 0 1px var(--green-soft);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
.node .accept-hint{font-size:10.5px;color:var(--green);font-weight:600;margin-left:2px}

/* 无权限：灰色带锁 */
.node.noauth{background:#f1f1ef;border-color:#dcdcd8;color:#a9aca7}
.node.noauth .dot{background:#cfcfcf !important}
.node.noauth.module{background:#f0f0ee;border-color:#d8d8d4}
.node.noauth .m-blurb{color:#b5b8b3}
.node .lock{font-size:11px;margin-left:1px}
.node .part-tag{font-size:10.5px;color:var(--auth);font-weight:600}

/* 授权模式 */
body.auth-mode .node{cursor:cell}
.node .auth-mark{display:none;width:15px;height:15px;border-radius:50%;border:2px solid #c9bfdd;
  align-items:center;justify-content:center;font-size:10px;color:#fff;flex:0 0 auto}
body.auth-mode .node .auth-mark{display:flex}
body.auth-mode .node .auth-mark.on{background:var(--auth);border-color:var(--auth)}
body.auth-mode .node:hover{border-color:var(--auth);box-shadow:0 2px 8px rgba(122,92,168,.25)}

.node .bug-badge{background:var(--red);color:#fff;border-radius:9px;min-width:17px;height:17px;
  line-height:17px;text-align:center;font-size:11px;padding:0 5px}
.node .focus-mark{color:var(--focus);font-weight:700;font-size:11px}
.node .add-child{position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:20px;height:20px;
  border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;
  line-height:17px;text-align:center;opacity:0;transition:opacity .12s}
.node:hover .add-child{opacity:1}
.node .add-child:hover{border-color:var(--green);color:var(--green)}
body.auth-mode .node .add-child{display:none}
.node.module .add-child{display:none}

/* ---------- 已取消托盘 ---------- */
.tray{position:fixed;left:16px;top:60px;z-index:29;width:330px;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(42,47,43,.14);
  padding:14px 16px;display:none}
.tray.open{display:block}
.tray h3{margin:0 0 3px;font-size:14px}
.tray p.hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
.tray ul{list-style:none;margin:0;padding:0}
.tray li{padding:9px 0;border-top:1px solid var(--line)}
.tray li:first-child{border-top:0}
.tray .t-title{font-size:13px;color:var(--muted);text-decoration:line-through}
.tray .t-actions{display:flex;gap:6px;margin-top:6px}
.tray .t-actions button{font-size:12px;padding:3px 9px}
.tray .t-actions .danger:hover{border-color:var(--red);color:var(--red)}
.tray .confirm-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--red)}
.tray .empty{color:var(--muted);font-size:12.5px;padding:6px 0}

/* ---------- 右侧抽屉 ---------- */
.drawer{position:fixed;top:49px;right:0;bottom:0;width:340px;z-index:20;background:var(--paper);
  border-left:1px solid var(--line);overflow:auto;padding:16px 18px 28px;cursor:default}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:2px}
.crumbs a{color:var(--green);text-decoration:none;cursor:pointer}
.crumbs .sep{color:var(--line)}
.drawer h2{margin:4px 0 0;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.state-chip{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;flex:0 0 auto}
.state-chip.dirty,.state-chip.dirty{background:var(--blue-soft);color:var(--blue)}
.state-chip.success{background:var(--green-soft);color:var(--green)}
.state-chip.failed{background:var(--red-soft);color:var(--red)}
.state-chip.module{background:var(--module-soft);color:var(--module)}
.state-chip.proposed-chip{background:#eceee9;color:var(--muted)}
.state-chip.noauth-chip{background:#eeeeec;color:#9a9d98}
.lead{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.note{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.note.alert{color:var(--red)}
.actions{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:#fff;
  border-radius:7px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--green);color:var(--green)}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:hover{opacity:.9;color:#fff}
button.auth-primary{background:var(--auth);border-color:var(--auth);color:#fff}
button.auth-primary:hover{opacity:.9;color:#fff}
button.warn:hover{border-color:var(--red);color:var(--red)}
button.quiet{border-color:transparent;color:var(--muted);padding:6px 8px}
button.quiet:hover{border-color:var(--line);color:var(--ink)}
.compose{display:flex;gap:6px;margin-top:10px;align-items:center}
.compose .ed{flex:1;min-width:0;padding:4px 2px}
.confirm-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--red)}
section.block{margin-top:16px}
section.block>h3{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.mem-list{list-style:none;margin:0;padding:0}
.mem-list li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.mem-list li:first-child{border-top:0}
.mem-list .dot{margin-top:5px}
.mem-list .src{color:var(--muted);font-size:11px;margin-left:6px;white-space:nowrap}
.mem-list li.dirty-item{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.ed{cursor:text;border-radius:3px;outline:none;-webkit-user-modify:read-write-plaintext-only}
.ed:hover{background:rgba(47,125,99,.07)}
.ed:focus{background:var(--green-soft);box-shadow:inset 0 -1.5px 0 var(--green)}
.ed.ghost{color:var(--muted)}
.ed.ghost:focus{color:var(--ink)}
h2 .ed{flex:1 1 auto;min-width:4em}
details.fold{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
details.fold>summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{color:var(--ink)}
details.fold .mem-list{margin-top:6px}

.bug-list{list-style:none;margin:0;padding:0}
.bug-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.bug-list li:first-child{border-top:0}
.bug-check{width:18px;height:18px;border:2px solid var(--red);border-radius:5px;cursor:pointer;
  flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;background:#fff}
.bug-check:hover{background:var(--red-soft)}
.bug-check.done{background:var(--green);border-color:var(--green)}
.bug-title{font-weight:600;font-size:13px}
.bug-sub{color:var(--muted);font-size:12px;margin-top:2px}
.bug-pending .bug-title{text-decoration:line-through;color:var(--muted)}
.summarizing{color:var(--green);font-size:12px;margin-top:3px}

.dormant-box input{width:100%;font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);
  border-radius:6px;background:#fff;margin:8px 0}
.dormant-list{list-style:none;margin:0;padding:0}
.dormant-list li{padding:7px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.dormant-list li:first-child{border-top:0}
.dormant-list b{color:var(--ink)}
.dormant-list .exp{display:block;margin-top:3px}
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="eyebrow">CONTEXT GUARD · 工作台原型</div>
    <h1>任务导图</h1>
  </div>
  <nav class="nav-crumbs" id="nav-crumbs"></nav>
  <div class="session-chip">当前会话：<b>S-0823 工作台开发</b> · 可读 <b id="auth-count">0</b> 节点</div>
  <button class="auth-btn" id="btn-auth">🔑 授权模式</button>
  <button class="tray-btn" id="btn-tray">🗂 已取消 (<span id="tray-count">0</span>)</button>
</header>

<div id="viewport">
  <div id="world">
    <svg id="links"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="tray" id="tray">
  <h3>已取消的提议</h3>
  <p class="hint">已隐藏，后续 Agent 不会读到。可重新加入 Context Map，或永久删除。</p>
  <ul id="tray-list"></ul>
</div>

<aside class="drawer" id="detail"></aside>

<script>
/* ================= 假数据 ================= */
const PINNED = [
  "回复和记忆一律使用中文",
  "记忆文件随 git 提交；密钥只留本地，永不入库"
];

let NODE_SEQ = 100;
const data = {
  id:"T0", title:"Context Guard 重构", state:"dirty", memories:[
    {text:"目标：Context Guard 变成人机协作维护记忆的范式", state:"success"},
    {text:"存储定了：记忆放项目目录，随 git 走", state:"success"}
  ], bugs:[], dormant:[], children:[

    { id:"M1", title:"记忆内核", kind:"module", purpose:"Agent 如何捕获、隔离、归档项目记忆", state:"success", memories:[
        {text:"模块结论：0822 分支为底，SKILL 只保留 58 行核心", state:"success"}
      ], bugs:[], dormant:[], children:[
        { id:"M1a", title:"用户消息记录", state:"success", memories:[
            {text:"分钟前缀 + 四种记录模式，OTP 永不落盘", state:"success"}
          ], bugs:[], dormant:[
            {title:"消息重复记录", exp:"UserPromptSubmit 与归档重复写同一句话；修复：归档前按分钟前缀去重。"}
          ], children:[] },
        { id:"M1b", title:"会话隔离", kind:"module", purpose:"各会话的私有草稿，以及什么可以进共享层", state:"dirty", memories:[
            {text:"子模块结论：sessions/<id>/ 私有草稿，loader 只注入允许集合", state:"dirty"}
          ], bugs:[], dormant:[], children:[
            { id:"M1b1", title:"outbox 候选共享", state:"dirty", memories:[
                {text:"探索：会话把值得共享的记忆放 outbox 等人合并", state:"dirty"}
              ], bugs:[], dormant:[], children:[] },
            { id:"M1b2", title:"transfers 定向传递", state:"dirty", memories:[], bugs:[], dormant:[], children:[] }
          ] },
        { id:"M1c", title:"归档流程", state:"dirty", memories:[], bugs:[
            {id:"B0", title:"会话结束无干净信号导致归档丢失", desc:"人不再回消息时，草稿未被提议合并", status:"open"}
          ], dormant:[], children:[] },
        { id:"P2", title:"记忆过期清理", origin:"agent", proposal:"proposed", isNew:false, state:"dirty",
          memories:[
            {text:"Agent 提议理由：sessions/ 会无限增长，需要按时间或数量清理旧会话草稿", state:"dirty"}
          ], bugs:[], dormant:[], children:[] }
      ]
    },

    { id:"M2", title:"人类工作台", kind:"module", purpose:"人在导图上梳理记忆、授权会话、确认修复", state:"dirty", memories:[
        {text:"想法：导图式任务树，子节点继承父节点的已完成记忆", state:"dirty"},
        {text:"想法：人只感知 Bug 和「Bug 修好了」两件事", state:"dirty"}
      ], bugs:[], dormant:[], children:[
        { id:"M2a", title:"任务导图视图", state:"dirty", memories:[
            {text:"探索：导图主画布 + 右侧抽屉，先不做拖拽排序", state:"dirty"}
          ], bugs:[
            {id:"B1", title:"焦点模式下新建的子节点没有继承焦点", desc:"在焦点链路外新建节点时导图没有变灰", status:"open"}
          ], dormant:[], children:[] },
        { id:"M2b", title:"Bug 叉掉流程", state:"dirty", memories:[], bugs:[
            {id:"B2", title:"叉掉 Bug 后经验没有进入休眠区", desc:"人确认修复后，Agent 未触发总结", status:"open"}
          ], dormant:[], children:[] },
        { id:"M2c", title:"焦点链路加载", state:"dirty", memories:[
            {text:"探索：新会话只注入焦点链路上的记忆，兄弟分支不可见", state:"dirty"}
          ], bugs:[], dormant:[], children:[] },
        { id:"P1", title:"模块钻取导航", origin:"agent", proposal:"proposed", isNew:true, state:"dirty",
          memories:[
            {text:"Agent 提议理由：本次任务实现了模块钻取，建议沉淀为正式节点，记录钻取交互的设计决定", state:"dirty"},
            {text:"完成情况：点模块进入其全局视图，面包屑返回上层", state:"dirty"}
          ], bugs:[], dormant:[], children:[] },
        { id:"P3", title:"自动跑回归测试", origin:"agent", proposal:"cancelled", isNew:false, state:"dirty",
          memories:[
            {text:"Agent 提议理由：每次改完工作台自动跑测试。已被人取消：测试门禁不属于本 skill", state:"dirty"}
          ], bugs:[], dormant:[], children:[] }
      ]
    },

    { id:"M3", title:"底层文件系统", kind:"module", purpose:"共享层 / 会话层如何落盘（待设计）", state:"dirty", memories:[
        {text:"待办：工作台定型后再设计 sessions/ 与 memory/ 结构", state:"dirty"}
      ], bugs:[], dormant:[], children:[
        { id:"M3a", title:"memory/ 共享层", state:"dirty", memories:[], bugs:[], dormant:[], children:[] },
        { id:"M3b", title:"sessions/ 会话层", state:"dirty", memories:[], bugs:[], dormant:[], children:[] },
        { id:"M3c", title:"transfers/ 定向传递", state:"dirty", memories:[], bugs:[], dormant:[], children:[] }
      ]
    }
  ]
};

let selectedId = "T0";
let focusId = null;
let viewRootId = "T0";
let authMode = false;
let composingId = null;
let pendingDeleteId = null;
let foldInherited = false;
let foldDormant = false;
const uiLabels = {memory:"记忆", bugs:"Bug", inherited:"继承的", dormant:"休眠经验"};
const sessionAuth = new Set(["T0","M2","M2a","M2b","M2c"]);

/* ================= 树工具 ================= */
function walk(node, fn, parents=[]){
  fn(node, parents);
  node.children.forEach(c=>walk(c, fn, [...parents, node]));
}
function findPath(id){
  let result=null;
  walk(data,(n,ps)=>{ if(n.id===id) result=[...ps,n]; });
  return result;
}
function getNode(id){ const p=findPath(id); return p? p[p.length-1] : null; }
function isCancelled(n){ return n.proposal==="cancelled"; }
function isProposed(n){ return n.proposal==="proposed"; }
function isAuth(n){ return sessionAuth.has(n.id); }
function visibleChildren(n){
  if(n.kind==="module" && n.id!==viewRootId) return [];
  return n.children.filter(c=>!isCancelled(c));
}
function vwalk(node, fn, parents=[]){
  fn(node, parents);
  visibleChildren(node).forEach(c=>vwalk(c, fn, [...parents, node]));
}
function onFocusPath(id){
  if(!focusId) return true;
  const fp = findPath(focusId).map(n=>n.id);
  const p  = findPath(id).map(n=>n.id);
  return fp.includes(id) || p.includes(focusId);
}
function subtreeIds(n){
  const ids=[];
  walk(n,(x)=>{ if(!isCancelled(x) && !isProposed(x)) ids.push(x.id); });
  return ids;
}
function moduleAuthState(n){
  const ids = subtreeIds(n);
  const inCount = ids.filter(id=>sessionAuth.has(id)).length;
  if(inCount===0) return "none";
  if(inCount===ids.length) return "all";
  return "partial";
}
function toggleAuth(n){
  if(isProposed(n)||isCancelled(n)) return;
  if(n.kind==="module"){
    const ids = subtreeIds(n);
    const st = moduleAuthState(n);
    if(st==="all"){ ids.forEach(id=>sessionAuth.delete(id)); }
    else{
      ids.forEach(id=>sessionAuth.add(id));
      findPath(n.id).forEach(a=>sessionAuth.add(a.id));
    }
  }else{
    if(sessionAuth.has(n.id)) sessionAuth.delete(n.id);
    else{
      sessionAuth.add(n.id);
      findPath(n.id).forEach(a=>sessionAuth.add(a.id));
    }
  }
  renderAll();
}
function cancelledList(){
  const out=[];
  walk(data,(n,ps)=>{ if(isCancelled(n)) out.push({node:n, parent:ps[ps.length-1]}); });
  return out;
}
function enterView(id){
  viewRootId = id; selectedId = id;
  renderAll();
  fitView();
}

/* ================= 导图渲染 ================= */
const GAP_X = 70, GAP_Y = 14, MOD_GAP_Y = 30;
const worldEl = document.getElementById("world");
const nodesEl = document.getElementById("nodes");
const linksEl = document.getElementById("links");
let extents = {w:800, h:500};

function nodeHtml(n, isViewRoot){
  const openBugs = n.bugs.filter(b=>b.status!=="dormant").length;
  const authMark = authMode && !isProposed(n)
    ? `<span class="auth-mark ${isAuth(n)?"on":""}">${isAuth(n)?"✓":""}</span>` : "";
  if(n.kind==="module" && !isViewRoot){
    const st = moduleAuthState(n);
    return `<div class="m-head">${authMark}<i class="dot module"></i><span>${n.title}</span>
        ${st==="none"?`<span class="lock">🔒</span>`: st==="partial"?`<span class="part-tag">部分</span>`:""}
        ${focusId===n.id?`<span class="focus-mark">◎</span>`:""}
      </div>
      <div class="m-blurb">${n.purpose||""}</div>`;
  }
  if(isProposed(n)){
    return (n.isNew?`<span class="new-dot" title="Agent 新提议"></span>`:"")+
      `<i class="dot proposed"></i><span>${n.title}</span>`+
      (n.id===selectedId && !authMode?`<span class="accept-hint">再点一次加入 ✓</span>`:"");
  }
  return authMark+`<i class="dot ${n.state}"></i><span>${n.title}</span>`+
    (!isAuth(n)?`<span class="lock">🔒</span>`:"")+
    (openBugs?`<span class="bug-badge">${openBugs}</span>`:"")+
    (focusId===n.id?`<span class="focus-mark">◎</span>`:"")+
    `<span class="add-child" title="延伸子任务">＋</span>`;
}

function renderMap(){
  const root = getNode(viewRootId);

  nodesEl.innerHTML = "";
  const els = new Map();
  vwalk(root,(n,ps)=>{
    const isViewRoot = n.id===viewRootId;
    const noauth = !isProposed(n) && !isAuth(n) &&
      !(n.kind==="module" && moduleAuthState(n)!=="none");
    const div = document.createElement("div");
    div.className = "node" + (isViewRoot?" root":"") +
      (n.kind==="module" && !isViewRoot?" module":"") +
      (isProposed(n)?" proposed":"") +
      (noauth?" noauth":"") +
      (n.id===selectedId?" selected":"") + (onFocusPath(n.id)?"":" dimmed");
    div.innerHTML = nodeHtml(n, isViewRoot);
    div.style.visibility = "hidden";
    nodesEl.appendChild(div);
    els.set(n.id, div);
  });
  const size = new Map();
  els.forEach((el,id)=>size.set(id,{w:el.offsetWidth,h:el.offsetHeight}));

  const pos = new Map();
  function gapFor(c){ return c.kind==="module" ? MOD_GAP_Y : GAP_Y; }
  function subtree(n, x, top){
    const s = size.get(n.id);
    const kids = visibleChildren(n);
    const childX = x + s.w + GAP_X;
    if(!kids.length){ pos.set(n.id,{x, y:top}); return s.h; }
    let y = top;
    kids.forEach((c,i)=>{ y += subtree(c, childX, y) + gapFor(c); });
    let total = y - gapFor(kids[kids.length-1]) - top;
    const first = kids[0], last = kids[kids.length-1];
    const fc = pos.get(first.id), lc = pos.get(last.id);
    const cy = (fc.y + size.get(first.id).h/2 + lc.y + size.get(last.id).h/2)/2;
    let ny = cy - s.h/2;
    if(s.h > total){
      const shift = (s.h-total)/2;
      kids.forEach(c=>shiftSubtree(c, shift));
      ny = top; total = s.h;
    }
    pos.set(n.id,{x, y:Math.max(ny, top)});
    return total;
  }
  function shiftSubtree(n, dy){
    const p = pos.get(n.id); if(p) p.y += dy;
    visibleChildren(n).forEach(c=>shiftSubtree(c, dy));
  }
  subtree(root, 0, 0);

  let maxX=0, maxY=0;
  els.forEach((el,id)=>{
    const p = pos.get(id), s = size.get(id);
    el.style.left = p.x+"px"; el.style.top = p.y+"px";
    el.style.visibility = "";
    maxX = Math.max(maxX, p.x+s.w); maxY = Math.max(maxY, p.y+s.h);
  });
  extents = {w:maxX, h:maxY};
  linksEl.setAttribute("width", maxX+140);
  linksEl.setAttribute("height", maxY+140);

  let paths="";
  vwalk(root,(n)=>{
    const p = pos.get(n.id), psz = size.get(n.id);
    visibleChildren(n).forEach(c=>{
      const q = pos.get(c.id), qs = size.get(c.id);
      const x1=p.x+psz.w, y1=p.y+psz.h/2, x2=q.x, y2=q.y+qs.h/2;
      const mx=x1+(x2-x1)*.5;
      const onF = focusId && onFocusPath(n.id) && onFocusPath(c.id);
      const dim = focusId && !(onFocusPath(n.id)&&onFocusPath(c.id));
      const na = !isProposed(c) && !isAuth(c) && !(c.kind==="module" && moduleAuthState(c)!=="none");
      paths += `<path class="link ${dim?'dimmed':''} ${onF?'focus-link':''} ${isProposed(c)?'proposed-link':''} ${na?'noauth-link':''}"
        d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });
  });
  linksEl.innerHTML = paths;

  els.forEach((el,id)=>{
    el.onclick = (e)=>{
      const n = getNode(id);
      if(authMode){
        toggleAuth(n); return;
      }
      if(e.target.classList.contains("add-child")){ addChild(n); return; }
      if(isProposed(n)){
        if(selectedId===id){ acceptProposal(n); return; }
        selectedId = id; n.isNew = false; renderAll(); return;
      }
      if(n.kind==="module" && n.id!==viewRootId){ enterView(n.id); return; }
      selectedId = id; renderAll();
    };
  });
}

function acceptProposal(n){
  n.proposal = "accepted"; n.isNew = false;
  selectedId = n.id;
  renderAll();
}
function cancelProposal(n){
  n.proposal = "cancelled"; n.isNew = false;
  const p = findPath(n.id);
  selectedId = p.length>1? p[p.length-2].id : "T0";
  renderAll();
}

function addChild(node){
  selectedId = node.id;
  composingId = node.id;
  renderAll();
  const input = document.querySelector("[data-compose]");
  if(input) input.focus();
}
function commitChild(node, title){
  const t = (title||"").trim();
  if(!t) return;
  composingId = null;
  const child = {id:"N"+(NODE_SEQ++), title:t, origin:"human", state:"dirty",
    memories:[], bugs:[], dormant:[], children:[]};
  node.children.push(child);
  sessionAuth.add(child.id);
  findPath(child.id).forEach(a=>sessionAuth.add(a.id));
  if(node.kind==="module" && node.id!==viewRootId){ enterView(node.id); return; }
  selectedId = child.id;
  renderAll();
}

/* ================= 抽屉 ================= */
const STATE_LABEL = {dirty:"探索中", success:"成功", failed:"失败"};
function textOf(el){ return (el.innerText||"").replace(/\u00a0/g," ").replace(/\s+/g," ").trim(); }
function bindEdit(el, commit, multiline){
  if(!el) return;
  el.contentEditable = "true";
  el.spellcheck = false;
  el.addEventListener("focus", ()=>{
    if(el.classList.contains("ghost")){
      const r = document.createRange(); r.selectNodeContents(el);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  });
  el.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !multiline){ e.preventDefault(); el.blur(); }
    if(e.key==="Escape"){ e.preventDefault(); el.blur(); }
  });
  el.addEventListener("blur", ()=>{
    const v = multiline ? (el.innerText||"").replace(/\u00a0/g," ").trim() : textOf(el);
    commit(v);
  });
}
function renderDetail(){
  const path = findPath(selectedId);
  const el = document.getElementById("detail");
  const node = path[path.length-1];
  const isModule = node.kind==="module";
  const proposed = isProposed(node), cancelled = isCancelled(node);
  const noauth = !proposed && !cancelled && !isAuth(node) &&
    !(isModule && moduleAuthState(node)!=="none");
  const composing = composingId===node.id;

  const inherited = [];
  path.slice(0,-1).filter(a=>!isProposed(a)&&!isCancelled(a)).forEach(anc=>{
    anc.memories.filter(m=>m.state!=="dirty").forEach(m=>inherited.push({mem:m, from:anc.title}));
  });
  const inhCount = PINNED.length + inherited.length;
  const openBugs = node.bugs.filter(b=>b.status!=="dormant");

  const memHtml = node.memories.length
    ? `<ul class="mem-list">`+node.memories.map((m,i)=>
        `<li class="${m.state==='dirty'?'dirty-item':''}"><i class="dot ${m.state}"></i><span class="txt ed" data-ed="mem" data-i="${i}">${m.text}</span></li>`
      ).join("")+`</ul>`
    : "";

  const bugHtml = openBugs.length
    ? `<ul class="bug-list">`+openBugs.map(b=>`
        <li class="${b.status==='pending'?'bug-pending':''}">
          <div class="bug-check ${b.status==='pending'?'done':''}" data-bug="${b.id}">${b.status==='pending'?"✓":""}</div>
          <div>
            <div class="bug-title ed" data-ed="bug-title" data-bug="${b.id}">${b.title}</div>
            ${b.status==='pending'? `<div class="summarizing">正在沉淀为经验…</div>`:`<div class="bug-sub ed" data-ed="bug-desc" data-bug="${b.id}">${b.desc||""}</div>`}
          </div>
        </li>`).join("")+`</ul>`
    : "";

  const note = proposed? `<p class="note">尚未加入地图，后续 Agent 读不到。</p>`
    : cancelled? `<p class="note">已隐藏。可从「已取消」恢复。</p>`
    : noauth? `<p class="note">Agent 读不到此项。</p>`
    : (focusId===node.id? `<p class="note">只看这条线。</p>`:"");

  const last = path.length-1;
  const crumbs = path.map((n,i)=> i===last
    ? `<span class="ed" data-ed="title">${n.title}</span>`
    : `<a data-id="${n.id}">${n.title}</a><span class="sep">›</span>`).join("");

  el.innerHTML = `
    <div class="crumbs">${crumbs}</div>
    <h2><span class="ed" data-ed="title">${node.title}</span>
      ${isModule? `<span class="state-chip module">模块</span>`:""}
      ${proposed? `<span class="state-chip proposed-chip">提议</span>`
        : cancelled? `<span class="state-chip failed">已取消</span>`
        : `<span class="state-chip ${node.state} ed" data-ed="badge">${node.badge||STATE_LABEL[node.state]}</span>`}
    </h2>
    ${isModule? `<p class="lead ed" data-ed="purpose">${node.purpose||""}</p>`:""}
    ${note}
    <div class="actions">
      ${proposed? `<button data-act="accept" class="primary">加入</button>
                   <button data-act="cancel" class="warn">隐藏</button>`:""}
      ${cancelled? `<button data-act="restore" class="primary">恢复</button>`:""}
      ${!proposed && !cancelled? `
        ${noauth? `<button data-act="grant" class="auth-primary">授权</button>`:""}
        ${composing?"":`<button data-act="child">＋ 子节点</button>`}
        <button data-act="focus" class="quiet">${focusId===node.id? "显示全部":"只看这条"}</button>
        ${node.state==="dirty" && !isModule? `<button data-act="done" class="quiet">完成</button>`:""}
        ${!noauth? `<button data-act="revoke" class="quiet">移出会话</button>`:""}`:""}
    </div>
    ${composing? `<div class="compose">
        <span class="ed ghost" data-ed="compose-title">子节点名称</span>
        <button data-act="compose-ok" class="primary">添加</button>
        <button data-act="compose-cancel" class="quiet">取消</button>
      </div>`:""}
    <section class="block">
      <h3><span class="ed" data-ed="label-memory">${uiLabels.memory}</span></h3>
      ${memHtml}
      <div class="empty ed ghost" data-ed="mem-new">${node.memories.length? "添加记忆":"还没有记忆。"}</div>
    </section>
    ${openBugs.length? `<section class="block"><h3><span class="ed" data-ed="label-bugs">${uiLabels.bugs}</span></h3>${bugHtml}</section>`:""}
    <details class="fold" data-fold="inherited" ${foldInherited?"open":""}>
      <summary><span class="ed" data-ed="label-inherited">${uiLabels.inherited}</span> ${inhCount} 条</summary>
      <ul class="mem-list">
        ${PINNED.map((t,i)=>`<li><i class="dot success"></i><span class="txt ed" data-ed="pinned" data-i="${i}">${t}</span></li>`).join("")}
        ${inherited.map((m,i)=>`<li><i class="dot ${m.mem.state}"></i><span class="txt ed" data-ed="inh" data-i="${i}">${m.mem.text}</span><span class="src">${m.from}</span></li>`).join("")}
      </ul>
    </details>
    ${node.dormant.length? `<details class="fold" data-fold="dormant" ${foldDormant?"open":""}>
      <summary><span class="ed" data-ed="label-dormant">${uiLabels.dormant}</span> ${node.dormant.length}</summary>
      <div class="dormant-box">
        <ul class="dormant-list" data-dorm-list>
          ${node.dormant.map((d,i)=>`<li><b class="ed" data-ed="dorm-title" data-i="${i}">${d.title}</b><span class="exp ed" data-ed="dorm-exp" data-i="${i}">${d.exp}</span></li>`).join("")}
        </ul>
      </div>
    </details>`:""}`;

  el.querySelectorAll(".crumbs a").forEach(a=>a.onclick=()=>{
    const target = getNode(a.dataset.id);
    const tp = findPath(target.id);
    const anchor = target.kind==="module" ? target
      : [...tp].reverse().find(n=>n.kind==="module" && n.id!==target.id) || data;
    viewRootId = anchor.id;
    selectedId = target.id;
    composingId = null;
    renderAll();
    fitView();
  });
  el.querySelectorAll(".bug-check").forEach(c=>c.onclick=()=>crossBug(node, c.dataset.bug));
  const q = s=>el.querySelector(s);
  if(q('[data-act="accept"]'))  q('[data-act="accept"]').onclick  = ()=>acceptProposal(node);
  if(q('[data-act="cancel"]'))  q('[data-act="cancel"]').onclick  = ()=>cancelProposal(node);
  if(q('[data-act="restore"]')) q('[data-act="restore"]').onclick = ()=>{ node.proposal="accepted"; renderAll(); };
  if(q('[data-act="grant"]'))   q('[data-act="grant"]').onclick   = ()=>toggleAuth(node);
  if(q('[data-act="revoke"]'))  q('[data-act="revoke"]').onclick  = ()=>toggleAuth(node);
  if(q('[data-act="child"]'))   q('[data-act="child"]').onclick   = ()=>addChild(node);
  if(q('[data-act="focus"]'))   q('[data-act="focus"]').onclick   = ()=>{
    focusId = (focusId===node.id? null : node.id); renderAll(); };
  if(q('[data-act="done"]'))    q('[data-act="done"]').onclick    = ()=>{ node.state="success";
    node.memories.push({text:"（演示）人确认本任务完成，Agent 把过程草稿收敛成这条结论", state:"success"}); renderAll(); };

  el.querySelectorAll("details.fold").forEach(d=>{
    d.addEventListener("toggle", ()=>{
      if(d.dataset.fold==="inherited") foldInherited = d.open;
      if(d.dataset.fold==="dormant") foldDormant = d.open;
    });
  });

  const refresh = (changedTitle)=>{
    if(changedTitle) renderAll();
  };
  el.querySelectorAll("[data-ed]").forEach(ed=>{
    const kind = ed.dataset.ed;
    const multiline = kind==="purpose" || kind==="dorm-exp";
    bindEdit(ed, v=>{
      if(kind==="title"){
        if(!v || v===node.title) return;
        node.title = v; renderAll(); return;
      }
      if(kind==="badge"){
        if(!v) return;
        const hit = Object.keys(STATE_LABEL).find(k=>STATE_LABEL[k]===v);
        if(hit){ node.state = hit; node.badge = ""; }
        else node.badge = v;
        renderAll(); return;
      }
      if(kind==="purpose"){ node.purpose = v; renderAll(); return; }
      if(kind==="label-memory"){ uiLabels.memory = v||"记忆"; return; }
      if(kind==="label-bugs"){ uiLabels.bugs = v||"Bug"; return; }
      if(kind==="label-inherited"){ uiLabels.inherited = v||"继承的"; return; }
      if(kind==="label-dormant"){ uiLabels.dormant = v||"休眠经验"; return; }
      if(kind==="mem"){
        const i = +ed.dataset.i;
        if(!v){ node.memories.splice(i,1); renderAll(); return; }
        if(node.memories[i].text===v) return;
        node.memories[i].text = v; return;
      }
      if(kind==="mem-new"){
        if(!v || v==="添加记忆" || v==="还没有记忆。") return;
        node.memories.push({text:v, state:"dirty"}); renderAll(); return;
      }
      if(kind==="pinned"){
        const i = +ed.dataset.i;
        if(v) PINNED[i] = v; return;
      }
      if(kind==="inh"){
        const i = +ed.dataset.i;
        if(inherited[i] && v) inherited[i].mem.text = v; return;
      }
      if(kind==="bug-title"){
        const b = node.bugs.find(x=>x.id===ed.dataset.bug);
        if(b && v) b.title = v; return;
      }
      if(kind==="bug-desc"){
        const b = node.bugs.find(x=>x.id===ed.dataset.bug);
        if(b) b.desc = v; return;
      }
      if(kind==="dorm-title"){
        const i = +ed.dataset.i;
        if(node.dormant[i] && v) node.dormant[i].title = v; return;
      }
      if(kind==="dorm-exp"){
        const i = +ed.dataset.i;
        if(node.dormant[i]) node.dormant[i].exp = v; return;
      }
      if(kind==="compose-title"){
        ed.dataset.value = v;
      }
    }, multiline);
  });

  const composeEl = q("[data-ed='compose-title']");
  const doCommit = ()=>{
    const v = composeEl ? textOf(composeEl) : "";
    if(v && v!=="子节点名称") commitChild(node, v);
  };
  if(q('[data-act="compose-ok"]')) q('[data-act="compose-ok"]').onclick = doCommit;
  if(q('[data-act="compose-cancel"]')) q('[data-act="compose-cancel"]').onclick = ()=>{ composingId=null; renderAll(); };
  if(composeEl) composeEl.focus();
}

/* ================= Bug 叉掉 → Agent 沉淀 → 休眠 ================= */
function crossBug(node, bugId){
  const bug = node.bugs.find(b=>b.id===bugId);
  if(!bug || bug.status!=="open") return;
  bug.status = "pending";
  renderAll();
  setTimeout(()=>{
    bug.status = "dormant";
    node.dormant.push({
      title: bug.title,
      exp: "（演示）Agent 总结：定位到根因并修复，验证方式已记录。此经验休眠，仅在同类 Bug 再现时检索。"
    });
    renderAll();
  }, 1600);
}

/* ================= 平移 / 缩放 / 自适应视口 ================= */
let view = {x:60, y:120, k:1};
function applyView(){
  worldEl.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
/* 让当前视图铺满可用区域：抽屉占右侧 400px，顶栏约 100px */
function fitView(){
  const availW = window.innerWidth - 340 - 90;
  const availH = window.innerHeight - 150;
  const k = Math.min(availW/Math.max(extents.w,1), availH/Math.max(extents.h,1), 1.35);
  view.k = Math.max(k, .35);
  view.x = 50 + Math.max(0,(availW - extents.w*view.k)/2);
  view.y = 115 + Math.max(0,(availH - extents.h*view.k)/2);
  applyView();
}
window.addEventListener("resize", fitView);
const vp = document.getElementById("viewport");
let dragging=false, sx=0, sy=0;
vp.addEventListener("mousedown", e=>{
  if(e.target.closest(".node")) return;
  dragging=true; sx=e.clientX-view.x; sy=e.clientY-view.y;
  vp.classList.add("grabbing");
});
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  view.x=e.clientX-sx; view.y=e.clientY-sy; applyView();
});
window.addEventListener("mouseup", ()=>{ dragging=false; vp.classList.remove("grabbing"); });
vp.addEventListener("wheel", e=>{
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.08 : 1/1.08;
  const nk = Math.min(2.2, Math.max(.35, view.k*factor));
  const rect = vp.getBoundingClientRect();
  const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
  view.x = cx - (cx-view.x)*(nk/view.k);
  view.y = cy - (cy-view.y)*(nk/view.k);
  view.k = nk;
  applyView();
},{passive:false});

function renderAll(){ renderNav(); renderTray(); renderMap(); renderDetail(); }
renderAll(); fitView();
</script>
</body>
</html>
