:root{--ink:#2d2d2d}

body{margin:0;background:#f3efe6;color:var(--ink);

.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:12px 18px;background:#fffdf8;border-bottom:2px solid #2d2d2d}
.bar b{font-size:16px}
.bar .hint{color:#746c60;font-size:13px}
.bar .picked{margin-left:auto;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 18px 48px}
.pick{border:2px solid #2d2d2d;border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;
  box-shadow:3px 3px 0 #2d2d2d}
.pick:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #2d2d2d}
.pick.on{outline:3px solid #2f6f4e;outline-offset:2px}
.pick h2{margin:0;padding:8px 12px;font-size:13px;border-bottom:1px solid #d7ccb8;background:#fffdf8}
.pick h2 span{color:#746c60;font-weight:600}
.stage{min-height:210px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.card{display:flex;flex-direction:column;align-items:stretch;width:252px;max-width:100%;
  padding:14px 16px 13px;cursor:default}
.card .head{display:flex;align-items:flex-start;gap:8px;font-weight:800;font-size:16px;line-height:1.3}
.card .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;margin-top:6px;background:#2d5da1}
.card .lock{font-size:11px;margin-left:auto}
.card .blurb{margin-top:6px;font-size:11px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card.root{width:min(280px,100%)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 6px;border-radius:999px;align-self:flex-start}
</style>

    ink:"#2a2e36", mute:"#6a707a", line:"#8a919c", radius:"6px", shadow:"inset 0 1px 0 #fff, 0 2px 4px rgba(0,0,0,.12)", bw:"1px",
    font:"IBM Plex Sans, sans-serif", note:"IBM Plex Sans, sans-serif", dot:"#4a5568"},
  {n:50, name:"现在加强选中", page:"#fefaf2", root:"#fff3bf", mod:"#f3ead6", sel:"#ffe66d", lock:"#d4d4d0",
    ink:"#2d2d2d", mute:"#8a8278", line:"#2d2d2d", radius:"8px", shadow:"3px 3px 0 #2d2d2d", bw:"2px",
    font:"Comic Neue, Trebuchet MS, sans-serif", note:"Georgia, serif", dot:"#2d5da1"},
];

function cardHTML(kind, t){
  const [title, blurb] = kind==="root" ? SAMPLE.root : SAMPLE.mod;
  const lock = kind==="lock" ? `<span class="lock">🔒</span>` : "";
  const tag = kind==="sel" ? `<span class="tag">选中</span>` : kind==="lock" ? `<span class="tag">未授权</span>` : "";
  const cls = "card " + (kind==="root" ? "root" : "mod") + (kind==="sel" ? " sel" : "") + (kind==="lock" ? " lock" : "");
  return `<div class="${cls}">${tag}
    <div class="head"><i class="dot"></i><span>${title}</span>${lock}</div>
    <div class="blurb">${blurb}</div>
  </div>`;
}

function applyTheme(el, t){
  const rootInk = t.rootInk || t.ink;
  const selInk = t.selInk || t.ink;
  el.style.background = t.page;
  el.querySelectorAll(".card").forEach(c=>{
    const isRoot = c.classList.contains("root");
    const isSel = c.classList.contains("sel");
    const isLock = c.classList.contains("lock");
    c.style.background = isLock ? t.lock : isSel ? t.sel : isRoot ? t.root : t.mod;
    c.style.color = isRoot ? rootInk : isSel ? selInk : t.ink;
    c.style.border = (t.bw==="0" ? "0" : `${t.bw} solid ${t.line}`);
    c.style.borderRadius = t.radius;
    c.style.boxShadow = t.shadow;
    c.style.fontFamily = t.font;
    if(t.bar){ c.style.borderLeft = `6px solid ${t.bar}`; }
    if(t.strip){ c.style.backgroundImage = `linear-gradient(${t.strip}, ${t.strip})`; c.style.backgroundSize = "100% 6px"; c.style.backgroundRepeat = "no-repeat"; c.style.paddingTop = "18px"; }
    if(t.extra==="polaroid"){ c.style.padding = "10px 10px 22px"; }
    const blurb = c.querySelector(".blurb");
    if(blurb){ blurb.style.color = t.mute; blurb.style.fontFamily = t.note; }
    const dot = c.querySelector(".dot");
    if(dot){ dot.style.background = t.dot; }
  });
}

const grid = document.getElementById("grid");
const picked = document.getElementById("picked");
let on = 0;
THEMES.forEach(t=>{
  const art = document.createElement("article");
  art.className = "pick";
  art.dataset.n = t.n;
  art.innerHTML = `<h2>${t.n} · ${t.name} <span>点选</span></h2>
    <div class="stage">
      ${cardHTML("root", t)}
      <div class="row">${cardHTML("mod", t)}${cardHTML("sel", t)}</div>
      ${cardHTML("lock", t)}
    </div>`;
  applyTheme(art.querySelector(".stage"), t);
  art.addEventListener("click", ()=>{
    on = t.n;
    document.querySelectorAll(".pick").forEach(p=>p.classList.toggle("on", p.dataset.n==String(on)));
    picked.textContent = "已选 #" + t.n + "  " + t.name;
    try{ localStorage.setItem("cg-node-style-pick", String(on)); }catch(e){}
  });
  grid.appendChild(art);
});
try{
  const n = parseInt(localStorage.getItem("cg-node-style-pick")||"0",10);
  if(n) grid.querySelector(`.pick[data-n="${n}"]`)?.click();
}catch(e){}
</script>
</body>
</html>
