name: CI | 代码与功能检查
run-name: >-
  CI | ${{ github.event_name == 'pull_request' && format('PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref) || format('{0} | {1}', github.ref_type == 'tag' && '标签检查' || '分支检查', github.ref_name) }}

# CI checks code and installation behavior; it never publishes to npm.
# Keep existing push coverage, including tags, and PRs targeting main.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: CI | 确定性影响分析
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      test: ${{ steps.select.outputs.test }}
      package: ${{ steps.select.outputs.package }}
      install: ${{ steps.select.outputs.install }}
      minimum_runtime: ${{ steps.select.outputs.minimum_runtime }}
      browser: ${{ steps.select.outputs.browser }}
      clients: ${{ steps.select.outputs.clients }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - name: Checkout complete history for merge-base diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: CI | 选择受影响检查，未知范围回退全量
        id: select
        shell: bash
        run: >-
          node .github/scripts/ci-impact.mjs
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha || '' }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
          --plan "$RUNNER_TEMP/ci-impact-plan.json"
      - name: Store impact plan for listener and review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: context-guard-ci-impact-plan
          path: ${{ runner.temp }}/ci-impact-plan.json
          if-no-files-found: error
          retention-days: 14

  security:
    name: CI | 敏感信息与禁入文件检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: CI | 安装并验证固定版本扫描器
        run: npm run security:setup
      - name: CI | 检查当前代码与新增提交
        run: node .github/scripts/security-scan.mjs ci

  test:
    name: CI 1 | 功能测试
    needs: [impact, security]
    if: needs.impact.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: CI | 准备安全检查
        run: npm run security:setup

      - name: CI | 运行功能测试
        run: npm test

  package:
    name: CI 2 | 包内容检查
    needs: [impact, security, test]
    if: >-
      always() &&
      needs.impact.outputs.package == 'true' &&
      needs.security.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: CI | 准备安全检查
        run: npm run security:setup

      - name: CI | 打包并检查必需及禁止文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --json --pack-destination dist > "$RUNNER_TEMP/npm-pack.json"
          node .github/scripts/verify-npm-package.mjs "$RUNNER_TEMP/npm-pack.json"
          node .github/scripts/verify-package-artifact.mjs dist --write-hash

      - name: CI | 上传前检查最终制品的敏感内容
        shell: bash
        run: node .github/scripts/security-scan.mjs package "$PACKAGE_TARBALL"

      - name: Store validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: context-guard-ci-package
          path: |
            dist/*.tgz
            dist/package.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  install:
    name: CI 3 | 安装测试 - ${{ matrix.name }}
    needs: [impact, package]
    if: needs.impact.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / minimum Node
            os: ubuntu-latest
            node: "18"
          - name: macOS
            os: macos-latest
            node: "24"
          - name: Windows
            os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: context-guard-ci-package
          path: dist

      - name: Verify package artifact
        run: node .github/scripts/verify-package-artifact.mjs dist

      - name: CI | 准备跨平台安全检查
        run: npm run security:setup

      - name: CI | 验证 npm 全局安装与 npx 安装
        run: node .github/scripts/smoke-npm-package.mjs --workspace "${{ runner.temp }}/context-guard-ci-smoke"

  minimum-runtime:
    name: CI 4 | 最低 Node 与 Python 版本
    needs: [impact, security]
    if: needs.impact.outputs.minimum_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"
          package-manager-cache: false
      - name: Setup minimum Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Prepare pinned security scanner
        run: npm run security:setup
      - name: Run the complete suite on minimum runtimes
        run: npm test

  browser:
    name: CI 5 | 工作台与 Agent 浏览器协作
    needs: [impact, security]
    if: needs.impact.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked test dependencies without installing a personal Skill
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install isolated CI browser and system dependencies
        run: |
          # GitHub's Ubuntu image may ship a stale Google Chrome APT index;
          # Playwright's pinned Chromium does not depend on that repository.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          npx --no-install playwright install --with-deps chromium

      - name: Exercise real workbench, public CLI and session inbox
        run: npm run test:browser

      - name: Store synthetic browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: context-guard-browser-report
          path: |
            output/playwright/browser-ci/**/results.json
            output/playwright/browser-ci/**/failure.txt
            output/playwright/browser-ci/**/*.png
          if-no-files-found: warn
          retention-days: 3

  clients:
    name: CI 6 | ${{ matrix.label }}
    needs: [impact, package]
    if: needs.impact.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: codex
            label: Codex 无对话兼容
          - client: claude
            label: Claude 无对话兼容
          - client: cursor
            label: Cursor 无对话兼容
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: context-guard-ci-package
          path: dist
      - name: Verify the shared package
        run: node .github/scripts/verify-package-artifact.mjs dist
      - name: Install the pinned client in an isolated directory
        run: node .github/scripts/install-ci-client.mjs "${{ matrix.client }}" "${{ runner.temp }}/client-tools"
      - name: Check without conversations or credentials
        run: node .github/scripts/smoke-clients.mjs --client "${{ matrix.client }}" --tools "${{ runner.temp }}/client-tools" --tarball "$PACKAGE_TARBALL" --evidence "${{ runner.temp }}/client-evidence"
      - name: Save scoped results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-${{ matrix.client }}-no-dialogue
          path: ${{ runner.temp }}/client-evidence
          if-no-files-found: warn
          retention-days: 3

  site:
    name: CI 7 | 官网构建与行为测试
    needs: [impact, security]
    if: needs.impact.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Typecheck and build
        working-directory: site
        run: npm run build
      - name: Check demo timing and camera
        working-directory: site
        run: node --experimental-strip-types --test scripts/client-timing.test.mjs scripts/native-camera.test.mjs

  required:
    # Keep this check name stable: main branch protection requires Required.
    name: Required
    if: always()
    needs:
      - impact
      - security
      - test
      - package
      - install
      - minimum-runtime
      - browser
      - clients
      - site
    runs-on: ubuntu-latest
    steps:
      - name: CI 8 | 核对选择计划与实际结果，决定是否允许合并
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_EXPECTED: ${{ needs.impact.outputs.test }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_EXPECTED: ${{ needs.impact.outputs.package }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          INSTALL_EXPECTED: ${{ needs.impact.outputs.install }}
          INSTALL_RESULT: ${{ needs.install.result }}
          MINIMUM_RUNTIME_EXPECTED: ${{ needs.impact.outputs.minimum_runtime }}
          MINIMUM_RUNTIME_RESULT: ${{ needs.minimum-runtime.result }}
          BROWSER_EXPECTED: ${{ needs.impact.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CLIENTS_EXPECTED: ${{ needs.impact.outputs.clients }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          SITE_EXPECTED: ${{ needs.impact.outputs.site }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          set -euo pipefail
          check_selected() {
            local name="$1"
            local expected="$2"
            local actual="$3"
            if [ "$expected" = "true" ]; then
              test "$actual" = "success" || {
                echo "$name was selected but finished as $actual" >&2
                exit 1
              }
            else
              test "$actual" = "skipped" || {
                echo "$name was not selected but finished as $actual" >&2
                exit 1
              }
            fi
          }
          test "$IMPACT_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          check_selected test "$TEST_EXPECTED" "$TEST_RESULT"
          check_selected package "$PACKAGE_EXPECTED" "$PACKAGE_RESULT"
          check_selected install "$INSTALL_EXPECTED" "$INSTALL_RESULT"
          check_selected minimum-runtime "$MINIMUM_RUNTIME_EXPECTED" "$MINIMUM_RUNTIME_RESULT"
          check_selected browser "$BROWSER_EXPECTED" "$BROWSER_RESULT"
          check_selected clients "$CLIENTS_EXPECTED" "$CLIENTS_RESULT"
          check_selected site "$SITE_EXPECTED" "$SITE_RESULT"
