name: CI | 代码与功能检查
run-name: >-
  CI | ${{ github.event_name == 'pull_request' && format('PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref) || format('{0} | {1}', github.ref_type == 'tag' && '标签检查' || '分支检查', github.ref_name) }}

# CI checks code and installation behavior; it never publishes to npm.
# Keep existing push coverage, including tags, and PRs targeting main.
on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: CI 1 | 功能测试与包内容检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: CI | 运行功能测试
        run: npm test

      - name: CI | 打包并检查必需及禁止文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --json --pack-destination dist > "$RUNNER_TEMP/npm-pack.json"
          node .github/scripts/verify-npm-package.mjs "$RUNNER_TEMP/npm-pack.json"
          node .github/scripts/verify-package-artifact.mjs dist --write-hash

      - name: Store validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: context-guard-ci-package
          path: |
            dist/*.tgz
            dist/package.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  install:
    name: CI 2 | 功能与安装测试 - ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / minimum Node
            os: ubuntu-latest
            node: "18"
          - name: macOS
            os: macos-latest
            node: "24"
          - name: Windows
            os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: context-guard-ci-package
          path: dist

      - name: Verify package artifact
        run: node .github/scripts/verify-package-artifact.mjs dist

      - name: CI | 验证三客户端生命周期
        run: npm test

      - name: CI | 验证 npm 全局安装与 npx 安装
        run: node .github/scripts/smoke-npm-package.mjs --workspace "${{ runner.temp }}/context-guard-ci-smoke"

  required:
    # Keep this check name stable: main branch protection requires Required.
    name: Required
    if: always()
    needs:
      - package
      - install
    runs-on: ubuntu-latest
    steps:
      - name: CI 3 | 汇总全部检查，决定是否允许合并
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          set -euo pipefail
          test "$PACKAGE_RESULT" = "success"
          test "$INSTALL_RESULT" = "success"
