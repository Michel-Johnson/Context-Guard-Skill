name: Promotion site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "prototype/workbench.html"
      - "SKILL.md"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Typecheck and build
        working-directory: site
        run: npm run build
      - name: Check demo timing and camera
        working-directory: site
        run: node --experimental-strip-types --test scripts/client-timing.test.mjs scripts/native-camera.test.mjs
      - name: Upload static site only
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
